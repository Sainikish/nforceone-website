<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NForceOne — Scale at Speed | Quality Engineering & Enterprise Tech</title>
    <meta name="description" content="NForceOne empowers global enterprises with AI-driven Quality Assurance, Software Development, Cloud DevOps, and Pega solutions. Scale at Speed." />
    <link rel="icon" type="image/jpeg" href="/images/nforceone_logo.jpg" />
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              nforce: {
                red: '#E60000',
                redHover: '#CC0000',
                redDark: '#990000',
                black: '#0A0A0A',
                darkSlate: '#121212',
                cardDark: '#171717',
                lightBg: '#FAFAFA',
                border: '#E5E7EB',
                borderDark: '#262626'
              }
            },
            fontFamily: {
              sans: ['Plus Jakarta Sans', 'Inter', 'sans-serif'],
            }
          }
        }
      }
    </script>
    <style>
      /* Smooth micro-interactions without motion bloat */
      .card-hover {
        transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease, background-color 0.2s ease;
      }
      .card-hover:hover {
        transform: translateY(-2px);
        box-shadow: 0 12px 24px -10px rgba(230, 0, 0, 0.12);
        border-color: rgba(230, 0, 0, 0.3);
      }
      @media (prefers-reduced-motion: reduce) {
        .card-hover:hover {
          transform: none;
        }
      }
      .btn-hover {
        transition: background-color 0.2s ease, transform 0.15s ease, box-shadow 0.2s ease;
      }
      .btn-hover:active {
        transform: scale(0.98);
      }

      /* Image Reel Infinite Scroll Animation */
      @keyframes marquee {
        0% { transform: translateX(0%); }
        100% { transform: translateX(-50%); }
      }
      @keyframes marquee-reverse {
        0% { transform: translateX(-50%); }
        100% { transform: translateX(0%); }
      }
      .animate-marquee-scroll {
        display: flex;
        width: max-content;
        animation: marquee 35s linear infinite;
      }
      .animate-marquee-scroll:hover {
        animation-play-state: paused;
      }
      .no-scrollbar::-webkit-scrollbar {
        display: none;
      }
      .no-scrollbar {
        -ms-overflow-style: none;
        scrollbar-width: none;
      }
    </style>
  </head>
  <body class="bg-neutral-50 text-neutral-900 font-sans antialiased selection:bg-red-600 selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
